<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D'Écuyer à Chevalier</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #1b1410;
      color: #f3e6c8;
      font-family: Georgia, "Times New Roman", serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .panneau {
      padding: 2.5rem 2rem;
      border: 3px double #c9a24a;
      background: #2a1f17;
      max-width: 420px;
      margin: 1rem;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 2rem;
      color: #e8c66a;
      letter-spacing: 0.03em;
    }
    .epee {
      font-size: 3rem;
      margin-bottom: 0.5rem;
    }
    p { line-height: 1.5; margin: 0.75rem 0; }
    .petit { font-size: 0.9rem; opacity: 0.7; }
  </style>
</head>
<body>
  <div class="panneau">
    <div class="epee">⚔️</div>
    <h1>D'Écuyer à Chevalier</h1>
    <p>La quête commence bientôt…</p>
    <p class="petit">Jeu en cours de création</p>
  </div>
</body>
</html>
